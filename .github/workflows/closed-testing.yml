name: Closed testing AABs

# Builds one release AAB per closed-testing stage (see Features.kt), signs each with
# the upload key from repo secrets, and attaches them to a temporary pre-release.
# Secrets: AIRGAP_KEYSTORE_B64 (base64 of the .jks), AIRGAP_KEYSTORE_PASSWORD,
# AIRGAP_KEY_ALIAS. The key password is the keystore password (PKCS12).
# Without the secrets, the AABs are attached unsigned as before.
on:
  workflow_dispatch:
    inputs:
      stages:
        description: "Stages to build, space separated (1-10)"
        required: true
        default: "1 2 3 4 5"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21

      - name: Install NDK, CMake and platform
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "ndk;27.2.12479018" "cmake;3.31.6" "build-tools;36.0.0"
          PLAT=$("$SDKM" --list 2>/dev/null | grep -oE 'platforms;android-37(\.[0-9]+)?' | sort -V | tail -1)
          echo "Platform package: ${PLAT:-none listed, AGP will fetch it}"
          if [ -n "$PLAT" ]; then "$SDKM" "$PLAT"; fi

      - name: Vulkan and SPIR-V headers
        run: |
          git clone --depth 1 https://github.com/KhronosGroup/Vulkan-Headers.git
          git clone --depth 1 https://github.com/KhronosGroup/SPIRV-Headers.git
          cmake -S SPIRV-Headers -B SPIRV-Headers/build -DCMAKE_INSTALL_PREFIX="$PWD/SPIRV-Headers/install"
          cmake --install SPIRV-Headers/build

      - uses: gradle/actions/setup-gradle@v4

      - name: Build AABs
        run: |
          mkdir -p out
          for n in ${{ inputs.stages }}; do
            ./gradlew --no-configuration-cache :app:bundleRelease -PreleaseStage=$n
            cp app/build/outputs/bundle/release/app-release.aab "out/airgap-stage$n-vc$n-unsigned.aab"
          done
          ls -la out

      - name: Sign AABs with the upload key
        env:
          KS_B64: ${{ secrets.AIRGAP_KEYSTORE_B64 }}
          STOREPASS: ${{ secrets.AIRGAP_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.AIRGAP_KEY_ALIAS }}
        run: |
          if [ -z "$KS_B64" ] || [ -z "$STOREPASS" ] || [ -z "$KEY_ALIAS" ]; then
            echo "Signing secrets not set; leaving AABs unsigned."
            echo "SIGNED=false" >> "$GITHUB_ENV"
            exit 0
          fi
          KS="$RUNNER_TEMP/upload.jks"
          echo "$KS_B64" | base64 -d > "$KS"
          for f in out/*-unsigned.aab; do
            signed="${f%-unsigned.aab}.aab"
            jarsigner -keystore "$KS" -storepass:env STOREPASS -keypass:env STOREPASS \
              -sigalg SHA256withRSA -digestalg SHA-256 -signedjar "$signed" "$f" "$KEY_ALIAS"
            jarsigner -verify "$signed"
            rm "$f"
          done
          rm -f "$KS"
          echo "SIGNED=true" >> "$GITHUB_ENV"
          ls -la out

      - name: Attach to a temporary pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="closed-testing-${{ github.run_number }}"
          if [ "$SIGNED" = "true" ]; then label="signed"; note="Signed with the upload key, ready for Play Console."; else label="unsigned"; note="Unsigned. Sign with the upload key before uploading."; fi
          gh release create "$tag" out/*.aab --prerelease --target "${{ github.sha }}" \
            --title "Closed testing build ${{ github.run_number }} ($label)" \
            --notes "Stage AABs (${{ inputs.stages }}). $note Temporary: delete after download."
